# ============================================================================
# Workflow CI — P6 exercice 2
#
# UN SEUL fichier, IDENTIQUE dans les deux repos (Angular et Java).
# Job test  : détecte le type de projet, lance run-tests.py, publie le rapport.
# Job build : construit l'image Docker et la pousse sur GHCR (après les tests).
# ============================================================================

name: CI

on:
  push:
  pull_request:

# Permissions du GITHUB_TOKEN pour l'ensemble du workflow :
#  - contents: read   -> checkout du code
#  - packages: write  -> push de l'image vers GHCR (ghcr.io)
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================================
  # JOB 1 — TEST (inchangé, déjà validé à l'étape 2)
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Détecter le type de projet
        id: detect
        run: |
          if [ -f "angular.json" ]; then
            echo "project_type=angular" >> "$GITHUB_OUTPUT"
            echo "Projet détecté : angular"
          elif [ -f "gradlew" ]; then
            echo "project_type=java" >> "$GITHUB_OUTPUT"
            echo "Projet détecté : java"
          else
            echo "ERREUR : aucun marqueur de projet trouvé (angular.json ou gradlew)."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.project_type == 'angular'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer Chrome
        if: steps.detect.outputs.project_type == 'angular'
        uses: browser-actions/setup-chrome@v1

      - name: Installer les dépendances (Angular)
        if: steps.detect.outputs.project_type == 'angular'
        run: npm ci

      - name: Setup JDK 21
        if: steps.detect.outputs.project_type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Exécuter les tests
        run: python3 run-tests.py

      - name: Publier le rapport de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.detect.outputs.project_type }}
          path: test-results/

  # ==========================================================================
  # JOB 2 — BUILD (nouveau, étape 3)
  #
  # Agnostique au langage : le `docker build` est identique pour les deux
  # projets (toute la logique spécifique vit dans le Dockerfile). Aucune
  # détection nécessaire ici.
  # ==========================================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Séquentiel : on ne build QUE si les tests passent. On ne publie jamais
    # une image dont les tests sont cassés.
    needs: test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # --- Calcul des métadonnées d'image (nom + tag) -----------------------
      # Nom de l'image = ghcr.io/<owner>/<repo>, forcé en minuscules (GHCR
      # l'exige ; un nom de repo peut contenir des majuscules).
      # Tag = <branche_nettoyée>-<sha_court> :
      #   - branche nettoyée : les '/' (interdits dans un tag Docker) -> '-'
      #   - sha court : 7 premiers caractères du SHA du commit
      - name: Préparer les métadonnées de l'image
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH_CLEAN="${GITHUB_REF_NAME//\//-}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TAG="${BRANCH_CLEAN}-${SHA_SHORT}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image cible : ${IMAGE_NAME}:${TAG}"

      # --- Authentification GHCR --------------------------------------------
      # docker/login-action gère le token en entrée MASQUÉE : le GITHUB_TOKEN
      # n'apparaît jamais en clair dans les logs. Token éphémère fourni par
      # GitHub, détruit en fin de run (point de vigilance "protéger les secrets").
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build + push de l'image ------------------------------------------
      # docker/build-push-action construit à partir du Dockerfile à la racine
      # et pousse l'image taguée vers GHCR.
      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}