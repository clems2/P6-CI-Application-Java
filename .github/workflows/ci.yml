# ============================================================================
# Workflow CI/CD — P6 exercice 2
#
# UN SEUL fichier, IDENTIQUE dans les deux repos (Angular et Java).
# test    : détecte le type de projet, lance run-tests.py, publie le rapport.
# build   : construit l'image Docker et la pousse sur GHCR (après les tests).
# release : semantic-release — versionne, génère le changelog, crée la release
#           GitHub. Réel sur `main`, dry-run (simulation) sur les autres branches.
# ============================================================================

name: CI

on:
  push:
  pull_request:

# Permissions du GITHUB_TOKEN :
#  - contents: write  -> créer des tags/releases (semantic-release) + checkout
#  - packages: write  -> push de l'image vers GHCR
permissions:
  contents: write
  packages: write

jobs:
  # ==========================================================================
  # JOB 1 — TEST (inchangé)
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Détecter le type de projet
        id: detect
        run: |
          if [ -f "angular.json" ]; then
            echo "project_type=angular" >> "$GITHUB_OUTPUT"
            echo "Projet détecté : angular"
          elif [ -f "gradlew" ]; then
            echo "project_type=java" >> "$GITHUB_OUTPUT"
            echo "Projet détecté : java"
          else
            echo "ERREUR : aucun marqueur de projet trouvé (angular.json ou gradlew)."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.project_type == 'angular'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer Chrome
        if: steps.detect.outputs.project_type == 'angular'
        uses: browser-actions/setup-chrome@v1

      - name: Installer les dépendances (Angular)
        if: steps.detect.outputs.project_type == 'angular'
        run: npm ci

      - name: Setup JDK 21
        if: steps.detect.outputs.project_type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Exécuter les tests
        run: python3 run-tests.py

      - name: Publier le rapport de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.detect.outputs.project_type }}
          path: test-results/

  # ==========================================================================
  # JOB 2 — BUILD (inchangé)
  # ==========================================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparer les métadonnées de l'image
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH_CLEAN="${GITHUB_REF_NAME//\//-}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TAG="${BRANCH_CLEAN}-${SHA_SHORT}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image cible : ${IMAGE_NAME}:${TAG}"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

# ==========================================================================
  # JOB 3 — RELEASE (mis à jour : + re-tag Docker via exec)
  # ==========================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      # Connexion à GHCR : nécessaire pour que exec puisse pull/push l'image
      # au moment du re-tag sémantique.
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On recalcule les mêmes métadonnées que le job build, pour dire à exec
      # QUELLE image re-taguer. IMAGE_NAME + SOURCE_TAG seront lus par exec
      # via process.env.
      - name: Préparer les métadonnées de l'image
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH_CLEAN="${GITHUB_REF_NAME//\//-}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=${BRANCH_CLEAN}-${SHA_SHORT}" >> "$GITHUB_ENV"

      - name: Lancer semantic-release (réel sur main, dry-run ailleurs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Branche main -> release réelle"
            npx semantic-release
          else
            echo "Branche ${GITHUB_REF_NAME} -> dry-run (simulation)"
            npx semantic-release --dry-run
          fi